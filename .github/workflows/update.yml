name: Update HF Downloads

on:
  schedule:
    - cron: '0 0 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-downloads:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packages
        run: |
          pip install pandas matplotlib requests

      - name: Test tracking script
        run: python -m unittest discover -s tests

      - name: Run tracking script
        run: python track_hf_downloads.py

      - name: Generate plot
        run: python plot_hf_downloads.py

      - name: Commit updates
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add hf_download_tracking.csv
          git add hf_download_trend.png
          git add README.md

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update download stats"
            git push
          fi
